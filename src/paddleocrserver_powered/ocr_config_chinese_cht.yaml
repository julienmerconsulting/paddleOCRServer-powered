SubModules:
  TextDetection:
    box_thresh: 0.6          # Augmente de 0.5 -> plus strict sur les boxes
    limit_side_len: 640      # Augmente de 480 -> meilleure résolution
    limit_type: max          
    max_side_limit: 4000
    model_dir: null
    model_name: PP-OCRv5_mobile_det
    module_name: text_detection
    thresh: 0.25             # Augmente de 0.2 -> moins de faux positifs
    unclip_ratio: 1.5        # Réduit de 1.8 -> boxes moins larges, moins de fusion
  TextLineOrientation:
    batch_size: 6
    model_dir: null
    model_name: PP-LCNet_x1_0_textline_ori
    module_name: textline_orientation
  TextRecognition:
    batch_size: 8            # Augmente de 6 -> traite plus en parallèle
    model_dir: null
    model_name: chinese_cht_PP-OCRv5_mobile_rec
    module_name: text_recognition
    score_thresh: 0.5        # Augmente de 0.0 -> filtre les résultats moyens
SubPipelines:
  DocPreprocessor:
    SubModules:
      DocOrientationClassify:
        model_dir: null
        model_name: PP-LCNet_x1_0_doc_ori
        module_name: doc_text_orientation
      DocUnwarping:
        model_dir: null
        model_name: UVDoc
        module_name: image_unwarping
    pipeline_name: doc_preprocessor
    use_doc_orientation_classify: false
    use_doc_unwarping: false
pipeline_name: OCR
text_type: general
use_doc_preprocessor: false
use_textline_orientation: false