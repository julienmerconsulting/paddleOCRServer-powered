name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build ruff

      - name: Lint (ruff)
        run: ruff check src

      - name: Build sdist + wheel
        run: python -m build

      - name: Verify package contents (no heavy deps)
        run: |
          python -m pip install --no-deps dist/*.whl
          python -c "from importlib import resources; \
            assert resources.files('paddleocrserver_powered').joinpath('languages.yaml').is_file(); \
            assert resources.files('paddleocrserver_powered').joinpath('ocr_config_latin.yaml').is_file(); \
            assert resources.files('paddleocrserver_powered').joinpath('ocr_config_latin_full.yaml').is_file(); \
            assert resources.files('paddleocrserver_powered').joinpath('ocr_config_japan.yaml').is_file(); \
            print('package data OK')"
